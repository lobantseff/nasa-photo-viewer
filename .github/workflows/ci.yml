name: CI

on:
  push:
    branches: [stable]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run redundant, except on the default branch
# where each commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let each platform report its own result
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs derives the version from `git describe`, and a shallow
          # clone carries no tags, so it would silently report a placeholder.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Test
        run: cargo test --locked

  icon:
    name: Icon is reproducible
    runs-on: macos-latest # iconutil, needed for the .icns, exists only here
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1 # no moving major tag is published; pin exact
        with:
          # The generator declares its dependencies inline and there is no lock
          # file to key a cache on.
          enable-cache: false

      - name: Check the committed icon matches its generator
        run: ./assets/generate_icon.py --check
